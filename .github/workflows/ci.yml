name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: madaflow
          POSTGRES_USER: madaflow
          POSTGRES_PASSWORD: madaflow_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: madaflow
      POSTGRES_USER: madaflow
      POSTGRES_PASSWORD: madaflow_ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      AI_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Installer les dépendances système (GeoDjango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev libgeos-dev libpq-dev

      - name: Installer les dépendances Python
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Donner les privilèges nécessaires à CREATE EXTENSION postgis
        run: |
          PGPASSWORD=madaflow_ci_password psql -h localhost -U madaflow -d postgres \
            -c "ALTER USER madaflow WITH SUPERUSER;" || \
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "ALTER USER madaflow WITH SUPERUSER;"
        env:
          PGPASSWORD: madaflow_ci_password

      - name: Vérifier la configuration Django (manage.py check)
        working-directory: backend
        run: python manage.py check

      - name: Vérifier l'absence de migrations manquantes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer la suite de tests avec couverture
        working-directory: backend
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Vérifier le style (flake8)
        working-directory: backend
        run: flake8 apps config

      - name: Vérifier le formatage (black)
        working-directory: backend
        run: black --check apps config --exclude=migrations

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-test:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérifier les types (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Vérifier le style (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Vérifier le formatage (prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Lancer la suite de tests
        working-directory: frontend
        run: npm run test

      - name: Build de production
        working-directory: frontend
        run: npm run build
